<!DOCTYPE html>
<html>

<head>

    <title>Explore Notes | NoteHub</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>Explore Notes 📚</h1>

        <p>Browse notes shared by students.</p>

        <hr>

        {% if notes %}

            {% for note in notes %}

                <div class="note-card">

                    <h2>{{ note[1] }}</h2>

                    <p>
                        <strong>Subject:</strong> {{ note[2] }}
                    </p>

                    <p>
                        {{ note[3] }}
                    </p>

                    {% if note[4] %}

                        <p>
                            📄
                            <a href="/uploads/{{ note[4] }}">
                                View / Download PDF
                            </a>
                        </p>

                    {% endif %}

                    <br>

                    <a href="/edit-note/{{ note[0] }}" class="btn">
                        ✏️ Edit
                    </a>

                    &nbsp;

                    <a href="/delete-note/{{ note[0] }}" class="btn">
                        🗑️ Delete
                    </a>

                </div>

            {% endfor %}

        {% else %}

            <div class="note-card">

                <p>No notes available yet.</p>

            </div>

        {% endif %}

        <br>

        <a href="/dashboard">
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
